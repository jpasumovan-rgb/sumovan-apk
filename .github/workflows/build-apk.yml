name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk SUMOVAN-MM-DOCs.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SUMOVAN-MM-DOCs
          path: SUMOVAN-MM-DOCs.apk
      - name: Publish download link (release "apk")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: SUMOVAN MM DOCs (latest APK)
          body: "Latest build. Drivers download SUMOVAN-MM-DOCs.apk below."
          files: SUMOVAN-MM-DOCs.apk
          make_latest: true
